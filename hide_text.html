
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #4c1d95;
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            background-color: #8b5cf6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #6d28d9;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hide & Show Text</h1>

        <p id="txt">JavaScript is awesome!</p>

        <button id="btn">Hide Text</button>

    </div>

    <script>
        let txt = document.getElementById("txt");
        let btn = document.getElementById("btn");

        btn.onclick = function() {

            if (txt.style.display === "none") {
                txt.style.display = "block";
                btn.innerHTML = "Hide Text";
            } 
            else {
                txt.style.display = "none";
                btn.innerHTML = "Show Text";
            }

        };
    </script>

</body>
</html>
