<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2>Check whether a number is positive or negative</h2>
    <script>
        let a=10;
        if(a>0){
            console.log("Positive")
        }
        else{
            console.log("Negative")
        }
    </script>
</body>
</html>
