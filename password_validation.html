<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwors Validation</title>
    <!-- Requiremnets :minimum length,atleast one number.one uppercase,etc-->
</head>
<body>
    <form id="registerForm">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button type="submit">Register</button>
    </form>
    <p id="passMsg"></p>

    <script>
        document.getElementById("registerForm").addEventListener("submit",function(e){
            let pwd=document.getElementById("password").value;
            let confirm=document.getElementById("confirmPassword").value;
            let msg="";

            if(pwd.length<6){
                msg="Passsword must be atleast 6 characaters.";
            }else if(!/[A-Z]/.test(pwd)){
                msg="Password must contain atleast one uppercase letter.";
            }else if(!/[0-9]/.test(pwd)){
                msg="Password must contain atleast one number."
            }else if(pwd!==confirm){
                msg="Passwords do not match.";
            }

            if(msg){
                e.preventDefault();
                document.getElementById("passMsg").innerHTML=msg;
            }else{
                alert("Registration successfull!");
            }
        })


    </script>
</body>
</html>
