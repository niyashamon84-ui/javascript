<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h2>Push operation</h2>
    <script>
        fruits=["Apple","Mango","Grapes"];
        fruits.push("Banana");
        console.log(fruits);
    </script>
    <h2>Pop : Removes last item</h2>
    <script>
        fruits=["Apple","Mango","Grapes"];
        fruits.pop();
        console.log(fruits);
    </script>
    <h2>length</h2>
    <script>
        fruits=["Apple","Mango","Grapes"];
        console.log(fruits.length);
    </script>
</body>
</html>
