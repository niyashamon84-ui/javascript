<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h2>Print the multiplication table of 5 using while loop</h2>
    <script>
        let i=1;
        while(i<=10){
            console.log(i*5);
            i++;
        }
    </script>
    
</body>
</html>
