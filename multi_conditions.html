<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Conditions</title>
</head>
<body>
    <h2>Multpile Conditions in JavaScript</h2>
    <script>
        let mark=75;
        if(mark>=90){
            console.log("A+");
        }else if(mark>=80){
            console.log("A");
        }else if(mark>=75){
            console.log("B+")
        }
    </script>
</body>
</html>
