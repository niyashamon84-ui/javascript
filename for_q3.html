<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h2>Print the multiplication table of 2 using for loop</h2>
    <script>
        for(i=1;i<=10;i++){
            console.log(i*2);
        }
    </script>
</body>
</html>
