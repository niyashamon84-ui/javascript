<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h2>Print numbers from 5 to 1 using while loop</h2>
    <script>
        let i=5;
        while(i>=1){
            console.log(i);
            i--;
        }
    </script>
    
</body>
</html>
