<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h2 id="title">Document Object Model(DOM)</h2>
    //DOM allows Javascript to access and change HTML elements.
    <script>
        document.getElementById("title").innerHTML="Welcome";//The webpage changes from "Document Object Model(DOM)" to "Welcome"

    </script>
</body>
</html>
