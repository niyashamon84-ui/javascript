<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2>Do While in JavaScript</h2>
    <script>
        let i=1;
        do{
            console.log(i);
            i++;
        } while(i<=5);
    </script>
</body>
</html>
